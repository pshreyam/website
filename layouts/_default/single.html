{{ define "main" }}
<article class="article-shell">
  <header class="page-hero article-hero">
    <p class="eyebrow">{{ .Section | title }}</p>
    <h1>{{ .Title }}</h1>
    <div class="meta-row">
      {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "Jan 2, 2006" }}</time>{{ end }}
      {{ with .Params.tags }}
        <div class="tags linked-tags">
          {{ range . }}<a href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}
        </div>
      {{ end }}
    </div>
    {{ with .Description }}<p class="article-summary">{{ . }}</p>{{ end }}
  </header>
  <div class="article-body">
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
