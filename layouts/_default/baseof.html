<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.summary }}{{ end }}" />
    <link rel="icon" href="{{ "favicon.ico" | relURL }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="{{ "/" | relURL }}">
            <span class="brand-mark">SP</span>
            <span class="brand-text">{{ .Site.Params.name }}</span>
          </a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav class="site-nav" id="primary-nav" aria-label="Primary">
            <a href="{{ "/" | relURL }}">Home</a>
            <a href="{{ "/projects/" | relURL }}">Projects</a>
            <a href="{{ "/blogs/" | relURL }}">Blogs</a>
            <a href="{{ "/tags/" | relURL }}">Tags</a>
            <a href="{{ "/contact/" | relURL }}">Contact</a>
          </nav>
        </div>
      </header>

      <main class="container main-content">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    <script>
      (() => {
        const header = document.querySelector(".site-header");
        const toggle = document.querySelector(".nav-toggle");
        const nav = document.querySelector(".site-nav");

        if (!header || !toggle || !nav) {
          return;
        }

        const closeMenu = () => {
          header.classList.remove("menu-open");
          toggle.setAttribute("aria-expanded", "false");
        };

        toggle.addEventListener("click", () => {
          const isOpen = header.classList.toggle("menu-open");
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        nav.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", closeMenu);
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth > 760) {
            closeMenu();
          }
        });
      })();
    </script>
  </body>
</html>
